<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1325" viewBox="0 0 1000 1325">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif" fill="#111827">
<text x="40" y="45" font-size="22" font-weight="bold">Audio PCM A: 48000 Hz, 16 bits, estereo</text>
<text x="40" y="75" font-size="13">Uma fonte uridecodebin e uma pipeline por execucao; linha tracejada = ligacao dinamica.</text>
<polyline points="500.0,160 500.0,195" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="500.0,275 500.0,345" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="520" y="310.0" font-size="12">pad-added: audio/x-raw</text>
<polyline points="500.0,400 500.0,450" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="500.0,505 500.0,545" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="500.0,600 500.0,640" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="500.0,720 500.0,760" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="500.0,815 500,845 250,845 250.0,875" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="500.0,815 500,845 750,845 750.0,875" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="250.0,930 250.0,970" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
