<polyline points="250.0,1120 250.0,1160" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="750.0,930 750.0,970" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="750.0,1025 750.0,1065" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="150" y="105" width="700" height="55" fill="#e8f1e8" stroke="#6b7280"/>
<text x="500.0" y="127.5" text-anchor="middle" font-size="13" font-weight="bold">Mesmo arquivo local com video e audio</text>
<text x="500.0" y="147.5" text-anchor="middle" font-size="13" font-weight="normal">Caminho passado em argv[1]</text>
<rect x="150" y="195" width="700" height="80" fill="#e8f1e8" stroke="#6b7280"/>
<text x="500.0" y="220.0" text-anchor="middle" font-size="13" font-weight="bold">uridecodebin name=source</text>
<text x="500.0" y="240.0" text-anchor="middle" font-size="13" font-weight="normal">uri = caminho convertido em file://</text>
<text x="500.0" y="260.0" text-anchor="middle" font-size="13" font-weight="normal">Trilha de audio decodificada para PCM</text>
<rect x="150" y="345" width="700" height="55" fill="#e9eff5" stroke="#6b7280"/>
<text x="500.0" y="367.5" text-anchor="middle" font-size="13" font-weight="bold">queue name=entrada_audio</text>
<text x="500.0" y="387.5" text-anchor="middle" font-size="13" font-weight="normal">Ligada pelo callback pad_added_handler</text>
<rect x="150" y="450" width="700" height="55" fill="#e9eff5" stroke="#6b7280"/>
<text x="500.0" y="472.5" text-anchor="middle" font-size="13" font-weight="bold">audioconvert</text>
<text x="500.0" y="492.5" text-anchor="middle" font-size="13" font-weight="normal">Altera representacao, profundidade e canais</text>
<rect x="150" y="545" width="700" height="55" fill="#e9eff5" stroke="#6b7280"/>
<text x="500.0" y="567.5" text-anchor="middle" font-size="13" font-weight="bold">audioresample</text>
<text x="500.0" y="587.5" text-anchor="middle" font-size="13" font-weight="normal">Altera a taxa de amostragem</text>
<rect x="150" y="640" width="700" height="80" fill="#f1f1f1" stroke="#6b7280"/>
<text x="500.0" y="665.0" text-anchor="middle" font-size="13" font-weight="bold">audio/x-raw</text>
<text x="500.0" y="685.0" text-anchor="middle" font-size="13" font-weight="normal">format=S16LE | rate=48000 | channels=2</text>
<text x="500.0" y="705.0" text-anchor="middle" font-size="13" font-weight="normal">layout=interleaved</text>
<rect x="150" y="760" width="700" height="55" fill="#e9eff5" stroke="#6b7280"/>
<text x="500.0" y="782.5" text-anchor="middle" font-size="13" font-weight="bold">tee name=a</text>
<text x="500.0" y="802.5" text-anchor="middle" font-size="13" font-weight="normal">Mesmo PCM para reproducao e WAV</text>
<rect x="70" y="875" width="360" height="55" fill="#e9eff5" stroke="#6b7280"/>
<text x="250.0" y="907.5" text-anchor="middle" font-size="13" font-weight="bold">a. ! queue</text>
<rect x="570" y="875" width="360" height="55" fill="#e9eff5" stroke="#6b7280"/>
<text x="750.0" y="907.5" text-anchor="middle" font-size="13" font-weight="bold">a. ! queue</text>
<rect x="70" y="970" width="360" height="55" fill="#e9eff5" stroke="#6b7280"/>
<text x="250.0" y="992.5" text-anchor="middle" font-size="13" font-weight="bold">audioconvert</text>
<text x="250.0" y="1012.5" text-anchor="middle" font-size="13" font-weight="normal">Adapta ao dispositivo</text>
<rect x="570" y="970" width="360" height="55" fill="#e9eff5" stroke="#6b7280"/>
<text x="750.0" y="992.5" text-anchor="middle" font-size="13" font-weight="bold">wavenc</text>
<text x="750.0" y="1012.5" text-anchor="middle" font-size="13" font-weight="normal">PCM sem compressao em WAV</text>
<rect x="70" y="1065" width="360" height="55" fill="#e9eff5" stroke="#6b7280"/>
<text x="250.0" y="1087.5" text-anchor="middle" font-size="13" font-weight="bold">audioresample</text>
<text x="250.0" y="1107.5" text-anchor="middle" font-size="13" font-weight="normal">Adapta ao dispositivo</text>
<rect x="570" y="1065" width="360" height="70" fill="#f8eedf" stroke="#6b7280"/>
<text x="750.0" y="1095.0" text-anchor="middle" font-size="13" font-weight="bold">filesink</text>
<text x="750.0" y="1115.0" text-anchor="middle" font-size="13" font-weight="normal">location=pcm_a.wav</text>
<rect x="70" y="1160" width="360" height="60" fill="#f8eedf" stroke="#6b7280"/>
<text x="250.0" y="1185.0" text-anchor="middle" font-size="13" font-weight="bold">autoaudiosink</text>
<text x="250.0" y="1205.0" text-anchor="middle" font-size="13" font-weight="normal">Reproducao de audio</text>
<text x="40" y="1285" font-size="13">O WAV conserva o PCM escolhido; a reproducao pode adaptar o formato ao dispositivo.</text>
</g>
</svg>