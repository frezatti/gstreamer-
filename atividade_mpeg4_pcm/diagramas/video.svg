<rect x="150" y="105" width="700" height="55" fill="#e8f1e8" stroke="#6b7280"/>
<text x="500.0" y="127.5" text-anchor="middle" font-size="13" font-weight="bold">Arquivo local com video e audio</text>
<text x="500.0" y="147.5" text-anchor="middle" font-size="13" font-weight="normal">Caminho passado em argv[1]</text>
