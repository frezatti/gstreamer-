<text x="500.0" y="220.0" text-anchor="middle" font-size="13" font-weight="bold">uridecodebin name=source</text>
<text x="500.0" y="240.0" text-anchor="middle" font-size="13" font-weight="normal">uri = caminho convertido em file://</text>
<text x="500.0" y="260.0" text-anchor="middle" font-size="13" font-weight="normal">Fonte, demuxer e decoders selecionados internamente</text>
