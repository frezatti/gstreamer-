<text x="500.0" y="862.5" text-anchor="middle" font-size="13" font-weight="normal">tune=zerolatency | speed-preset=ultrafast</text>
<text x="500.0" y="882.5" text-anchor="middle" font-size="13" font-weight="normal">bitrate=1000 kbit/s</text>
